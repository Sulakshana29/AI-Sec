version: '3.8'

services:
  llm-security-gateway:
    build: .
    container_name: llm_security_gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount the log file so we can read it on the host machine
      - ./audit.log:/app/audit.log
    restart: unless-stopped
